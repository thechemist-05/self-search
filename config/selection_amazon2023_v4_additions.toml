# Product selection rules, version 4 (2026-10-23): 50,000 products ADDED to the validated
# 50,000-product selection-v3 catalogue, in the allocation requested on 2026-10-23, from the
# same pinned Amazon Reviews 2023 revision:
#
#   [clothing]  Clothing, Shoes & Jewelry   sarees 8,000; lehengas 7,000; earrings 6,000;
#                                           footwear 7,000; bags and accessories 5,000;
#                                           other jewellery 4,000; men's fashion 5,000
#   [beauty]    All Beauty                  beauty and personal care 4,000
#   [handmade]  Handmade Products           home and lifestyle 3,000
#   [sports]    Sports and Outdoors         sports and fitness 1,000
#
# - The v3 catalogue (config/selection_amazon2023_v3.toml) is kept as it is; these rules only
#   choose additional products. Products already in v3 (same parent_asin), identical normalised
#   titles and same-seller near-duplicates are never added twice (scripts/build_expanded_db.py).
# - Each group's quota is shared by its sub-style types with the balanced split, so a group
#   covers its range (silk, Banarasi, Kanjivaram, cotton ... sarees). A group with too few
#   genuine products is filled as far as possible and the shortfall is reported; it is never
#   padded with other products.
# - Types are matched in file order: the first type whose keywords (and required words)
#   are in the title wins; exclude phrases veto a type or, at category level, every type.
# - Review rule: at least ONE review of >= 20 characters (v3 required three). Several
#   requested categories are scarce in this US dataset; a product with one real review still
#   has evidence. Within each type the products with the most qualifying reviews are chosen
#   first, so abundant groups still get well-reviewed products. At most 8 reviews are kept.

version = "selection-v4-allocation"
dedupe_identical_titles = true
min_qualifying_reviews = 1
min_review_chars = 20
max_reviews_per_product = 8

# ============================================================================
[clothing]
quota = 42000
exclude_title_keywords = [
  "socks", "shoe size", "sock size", "watch", "watches", "wristwatch",
  "keychain", "keychains", "key chain", "key ring", "keyring",
  "shoe charms", "clog charms", "bag charm", "purse charm", "handbag charm", "charms for",
  "shoelaces", "shoe laces", "laces", "shoe covers", "insoles", "packing cubes",
  "hanger", "hangers", "sticker", "stickers", "face mask", "dress gloves", "dress hat",
  "cleaner", "cleaners", "cleaning", "eraser", "erasers", "shoe polish", "deodorizer", "deodorizers",
  "deodorant", "shoe stretcher", "shoe stretchers", "shoe tree", "shoe trees", "shoe brush",
  "protector spray", "waterproofing spray", "repair kit", "lace lock", "lace locks", "clouser",
  "heel grips", "heel grip", "heel pads", "heel protectors", "shoe clips", "shoe horn",
  "doll", "dolls", "costume accessory", "jewelry making", "jewellery making", "beads for",
  "earring back", "earring backs", "earring backings", "earring holder", "earring organizer",
  "jewelry box", "jewelry organizer", "jewellery box", "jewelry cleaner", "ring sizer",
]

[clothing.groups]
sarees = 8000
lehengas = 7000
earrings = 6000
jewellery = 4000
mens = 5000
footwear = 7000
bags = 5000

