# Synthetic INR price-estimate ranges for ShelfSense (experimental).
#
# THESE ARE ILLUSTRATIVE ASSUMPTIONS, NOT MARKET DATA.
# They were written by hand for a research prototype so that budget filtering can be
# demonstrated on catalogues that have no INR prices. They are not based on price
# research, retailer data or currency conversion, and must never be presented as
# real or retailer prices.
#
# How they are used (src/pricing/estimates.py):
# - Only products WITHOUT a verified source price get an estimate.
# - The first rule (in file order) whose keywords match the product's title or
#   category path is used. A product that matches no rule keeps an unknown price.
# - The amount is a deterministic point inside the rule's range, derived from
#   sha256(version | source | external_id), rounded to the nearest 10 rupees.
# - Changing anything here requires a new `version`, which changes the estimates.

version = "illustrative-inr-v1"
currency = "INR"
method = "category_range_uniform_v1"
disclaimer = "Illustrative assumption, not a market or retailer price."

[[rule]]
key = "sneakers"
title_keywords = ["sneaker", "sneakers"]
category_keywords = []
min = 1500
max = 6000

[[rule]]
key = "running_shoes"
title_keywords = ["running shoe", "running shoes", "trainers"]
category_keywords = []
min = 1500
max = 7000

[[rule]]
key = "sandals"
title_keywords = ["sandal", "sandals", "flip flop", "flip-flop", "slides"]
category_keywords = []
min = 300
max = 2500

[[rule]]
key = "boots"
title_keywords = ["boot", "boots"]
category_keywords = []
min = 1500
max = 8000

[[rule]]
key = "backpacks"
title_keywords = ["backpack", "backpacks", "rucksack"]
category_keywords = ["backpacks"]
min = 600
max = 3500

[[rule]]
key = "handbags"
title_keywords = ["handbag", "tote", "sling bag", "shoulder bag"]
category_keywords = ["handbags"]
min = 500
max = 4000

[[rule]]
key = "earbuds_headphones"
title_keywords = ["earbud", "earbuds", "headphone", "headphones", "earphone", "earphones"]
category_keywords = ["headphones"]
min = 700
max = 9000

[[rule]]
key = "speakers"
title_keywords = ["speaker", "speakers", "soundbar"]
category_keywords = ["speakers"]
